<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="580" viewBox="0 0 1500 580" role="img" aria-labelledby="title desc">
<title id="title">Evidence-grounded log triage pipeline</title><desc id="desc">Raw logs are parsed into canonical events, clustered semantically, linked by temporal and dependency graphs, and packaged as validated evidence for a future LLM stage.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#66768b"/></marker></defs>
<rect width="1500" height="580" fill="#ffffff"/>
<text x="70" y="58" font-family="Arial" font-size="34" font-weight="bold" fill="#15233d">Evidence-grounded log triage: evaluation boundary</text>
<text x="70" y="94" font-family="Arial" font-size="19" fill="#5c6b7c">Solid stages exist in the supplied handoff snapshot; the LLM/RCA stage remains future work.</text>
<g font-family="Arial" text-anchor="middle">
  <rect x="55" y="160" width="170" height="90" rx="14" fill="#e5effa" stroke="#285aa0" stroke-width="2"/><text x="140" y="197" font-size="21" font-weight="bold" fill="#15233d">Raw logs</text><text x="140" y="226" font-size="16" fill="#28394f">input file</text>
  <rect x="275" y="160" width="190" height="90" rx="14" fill="#e5effa" stroke="#285aa0" stroke-width="2"/><text x="370" y="197" font-size="21" font-weight="bold" fill="#15233d">Parse &amp; normalize</text><text x="370" y="226" font-size="16" fill="#28394f">stable event IDs</text>
  <rect x="515" y="160" width="180" height="90" rx="14" fill="#e5effa" stroke="#285aa0" stroke-width="2"/><text x="605" y="197" font-size="21" font-weight="bold" fill="#15233d">Canonical events</text><text x="605" y="226" font-size="16" fill="#28394f">EventStore</text>
  <rect x="745" y="135" width="190" height="90" rx="14" fill="#e1f5f6" stroke="#0091a5" stroke-width="2"/><text x="840" y="171" font-size="20" font-weight="bold" fill="#15233d">Semantic grouping</text><text x="840" y="200" font-size="16" fill="#28394f">embeddings + clusters</text>
  <rect x="745" y="270" width="190" height="90" rx="14" fill="#e1f5f6" stroke="#0091a5" stroke-width="2"/><text x="840" y="306" font-size="20" font-weight="bold" fill="#15233d">Graph reasoning</text><text x="840" y="335" font-size="16" fill="#28394f">temporal + dependencies</text>
  <rect x="990" y="200" width="195" height="100" rx="14" fill="#fff5de" stroke="#c27e11" stroke-width="2"/><text x="1087" y="239" font-size="21" font-weight="bold" fill="#15233d">Evidence package</text><text x="1087" y="270" font-size="16" fill="#28394f">IDs + polarity + scores</text>
  <rect x="1240" y="200" width="200" height="100" rx="14" fill="#f8eeee" stroke="#ab3b36" stroke-width="2" stroke-dasharray="7 5"/><text x="1340" y="235" font-size="21" font-weight="bold" fill="#15233d">Future RCA stage</text><text x="1340" y="263" font-size="16" fill="#28394f">LLM + ranked hypotheses</text><text x="1340" y="285" font-size="13" fill="#ab3b36">not evaluated</text>
</g>
<g fill="none" stroke="#66768b" stroke-width="3" marker-end="url(#arrow)">
  <path d="M225 205 H270"/><path d="M465 205 H510"/><path d="M695 190 H740"/><path d="M695 220 C720 220 715 315 740 315"/><path d="M935 180 C960 180 962 222 985 240"/><path d="M935 315 C960 315 962 279 985 260"/><path d="M1185 250 H1235"/>
</g>
<rect x="75" y="420" width="630" height="90" rx="12" fill="#f5f7fa" stroke="#d6dde6"/><text x="95" y="452" font-family="Arial" font-size="20" font-weight="bold" fill="#15233d">Integrity checks</text><text x="95" y="483" font-family="Arial" font-size="17" fill="#28394f">Line accounting • artifact hashes • event references • schema consistency</text>
<rect x="745" y="420" width="695" height="90" rx="12" fill="#fff5de" stroke="#c27e11"/><text x="765" y="452" font-family="Arial" font-size="20" font-weight="bold" fill="#15233d">Interpretation guardrail</text><text x="765" y="483" font-family="Arial" font-size="17" fill="#28394f">Temporal order, semantic similarity and dependency edges are candidate signals—not causal proof.</text>
</svg>
