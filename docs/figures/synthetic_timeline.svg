<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="580" viewBox="0 0 1500 580" role="img" aria-labelledby="title desc">
<title id="title">Synthetic incident timeline for a log triage demonstration</title><desc id="desc">Timeline shows database connection pool exhaustion, a successful health probe as counterevidence, checkout timeout, payment timeout, and database recovery.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#66768b"/></marker></defs>
<rect width="1500" height="580" fill="#ffffff"/>
<text x="65" y="56" font-family="Arial" font-size="33" font-weight="bold" fill="#15233d">Synthetic incident timeline — candidate evidence only</text>
<text x="65" y="90" font-family="Arial" font-size="18" fill="#5c6b7c">Generated demonstration fixture • not a real incident and not evidence of an experimentally verified cause</text>
<line x1="100" y1="265" x2="1390" y2="265" stroke="#66768b" stroke-width="4" marker-end="url(#arrow)"/>
<g font-family="Arial" text-anchor="middle">
  <circle cx="165" cy="265" r="12" fill="#ab3b36"/><line x1="165" y1="253" x2="165" y2="165" stroke="#ab3b36" stroke-width="2"/><text x="165" y="130" font-size="20" font-weight="bold" fill="#15233d">10:00:00</text><text x="165" y="157" font-size="19" font-weight="bold" fill="#ab3b36">database</text><rect x="80" y="293" width="170" height="72" rx="10" fill="#f8eeee" stroke="#ab3b36"/><text x="165" y="322" font-size="16" fill="#28394f">Connection pool</text><text x="165" y="344" font-size="16" fill="#28394f">exhausted</text>
  <circle cx="435" cy="265" r="12" fill="#1d7d73"/><line x1="435" y1="253" x2="435" y2="165" stroke="#1d7d73" stroke-width="2"/><text x="435" y="130" font-size="20" font-weight="bold" fill="#15233d">10:00:02</text><text x="435" y="157" font-size="19" font-weight="bold" fill="#1d7d73">database</text><rect x="350" y="293" width="170" height="72" rx="10" fill="#eaf6f3" stroke="#1d7d73"/><text x="435" y="322" font-size="16" fill="#28394f">Health probe succeeds</text><text x="435" y="344" font-size="16" fill="#1d7d73" font-weight="bold">counter-signal</text>
  <circle cx="705" cy="265" r="12" fill="#c27e11"/><line x1="705" y1="253" x2="705" y2="165" stroke="#c27e11" stroke-width="2"/><text x="705" y="130" font-size="20" font-weight="bold" fill="#15233d">10:00:03</text><text x="705" y="157" font-size="19" font-weight="bold" fill="#c27e11">checkout</text><rect x="620" y="293" width="170" height="72" rx="10" fill="#fff5de" stroke="#c27e11"/><text x="705" y="322" font-size="16" fill="#28394f">Database request</text><text x="705" y="344" font-size="16" fill="#28394f">times out</text>
  <circle cx="975" cy="265" r="12" fill="#c27e11"/><line x1="975" y1="253" x2="975" y2="165" stroke="#c27e11" stroke-width="2"/><text x="975" y="130" font-size="20" font-weight="bold" fill="#15233d">10:00:05</text><text x="975" y="157" font-size="19" font-weight="bold" fill="#c27e11">payment</text><rect x="890" y="293" width="170" height="72" rx="10" fill="#fff5de" stroke="#c27e11"/><text x="975" y="322" font-size="16" fill="#28394f">Authorization</text><text x="975" y="344" font-size="16" fill="#28394f">timeout</text>
  <circle cx="1245" cy="265" r="12" fill="#1d7d73"/><line x1="1245" y1="253" x2="1245" y2="165" stroke="#1d7d73" stroke-width="2"/><text x="1245" y="130" font-size="20" font-weight="bold" fill="#15233d">10:00:08</text><text x="1245" y="157" font-size="19" font-weight="bold" fill="#1d7d73">database</text><rect x="1160" y="293" width="170" height="72" rx="10" fill="#eaf6f3" stroke="#1d7d73"/><text x="1245" y="322" font-size="16" fill="#28394f">Connection pool</text><text x="1245" y="344" font-size="16" fill="#28394f">recovered</text>
</g>
<rect x="95" y="430" width="1310" height="78" rx="12" fill="#e5effa" stroke="#285aa0"/><text x="750" y="460" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#15233d">Possible graph relation: database → checkout → payment</text><text x="750" y="487" text-anchor="middle" font-family="Arial" font-size="16" fill="#28394f">Only if dependency provenance supports it; temporal order and graph connectivity do not prove causality.</text>
</svg>
